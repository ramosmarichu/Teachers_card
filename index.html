<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futuristic Teachers Day Card</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="/_sdk/element_sdk.js"></script>
 
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="card-container">
   <div class="card">
    <div class="glow-effect"></div><!-- Front Face -->
    <div class="card-face front">
     <div class="sparkles">
      <div class="sparkle">
       ✨
      </div>
      <div class="sparkle">
       ⭐
      </div>
      <div class="sparkle">
       💫
      </div>
      <div class="sparkle">
       🌟
      </div>
     </div>
     <div class="decorative-elements">
      🎓📚
     </div>
     <div class="front-title" id="frontMessage">
      Happy Teachers Day
     </div>
     
    </div><!-- Back Face -->
    <div class="card-face back">
     <div class="decorative-elements">
      💝🌸
     </div>
     <div class="message-area">
      <div class="message-text" id="personalMessage">
       Dear Teacher,<br><br>
        Thank you for your dedication to teach us and the love that you have given to us salamat san damo sir. Your guidance shapes our future and makes learning a wonderful journey.<br><br>
        Sir Ace Letada 
      </div>
     </div>
    </div>
   </div>
  </div>
  <script>
            primary_color: "#ff6b6b",
            secondary_color: "#667eea",
            font_family: "Arial",
            font_size: 16
        };

        async function render(config) {
            const frontMessageEl = document.getElementById('frontMessage');
            const personalMessageEl = document.getElementById('personalMessage');
            const instructionEl = document.getElementById('instructionText');

            if (frontMessageEl) {
                frontMessageEl.textContent = config.teachers_day_message || defaultConfig.teachers_day_message;
            }

            if (personalMessageEl) {
                const message = config.personal_message || defaultConfig.personal_message;
                personalMessageEl.innerHTML = message.replace(/\n/g, '<br>');
            }

            if (instructionEl) {
                instructionEl.textContent = config.instruction_text || defaultConfig.instruction_text;
            }

            // Apply colors
            const primaryColor = config.primary_color || defaultConfig.primary_color;
            const secondaryColor = config.secondary_color || defaultConfig.secondary_color;
            
            document.body.style.background = `linear-gradient(135deg, ${secondaryColor} 0%, ${primaryColor} 100%)`;

            // Apply font
            const customFont = config.font_family || defaultConfig.font_family;
            const baseSize = config.font_size || defaultConfig.font_size;
            
            document.body.style.fontFamily = `${customFont}, Arial, sans-serif`;
            
            if (frontMessageEl) {
                frontMessageEl.style.fontSize = `${baseSize * 2.5}px`;
                frontMessageEl.style.fontFamily = `${customFont}, 'Brush Script MT', cursive`;
            }
            
            if (personalMessageEl) {
                personalMessageEl.style.fontSize = `${baseSize * 1.1}px`;
            }

        function mapToCapabilities(config) {
            return {
                recolorables: [
                    {
                        get: () => config.primary_color || defaultConfig.primary_color,
                        set: (value) => {
                            config.primary_color = value;
                            window.elementSdk.setConfig({ primary_color: value });
                        }
                    },
                    {
                        get: () => config.secondary_color || defaultConfig.secondary_color,
                        set: (value) => {
                            config.secondary_color = value;
                            window.elementSdk.setConfig({ secondary_color: value });
                        }
                    }
                ],
                borderables: [],
                fontEditable: {
                    get: () => config.font_family || defaultConfig.font_family,
                    set: (value) => {
                        config.font_family = value;
                        window.elementSdk.setConfig({ font_family: value });
                    }
                },
                fontSizeable: {
                    get: () => config.font_size || defaultConfig.font_size,
                    set: (value) => {
                        config.font_size = value;
                        window.elementSdk.setConfig({ font_size: value });
                    }
                }
            };
        }

        function mapToEditPanelValues(config) {
            return new Map([
                ["teachers_day_message", config.teachers_day_message || defaultConfig.teachers_day_message],
                ["personal_message", config.personal_message || defaultConfig.personal_message],
                ["instruction_text", config.instruction_text || defaultConfig.instruction_text]
            ]);
        }

        // Initialize the SDK
        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig,
                render,
                mapToCapabilities,
                mapToEditPanelValues
            });
        }

        // Initial render
        render(defaultConfig);
    </script>
